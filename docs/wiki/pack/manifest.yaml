# Portable wiki-brain pack manifest.
# Used by docs/wiki/scripts/wiki_pack.py export

version: 1
pack_name: wiki-brain
install_root: docs/wiki

# Copied as-is into the destination wiki root
portable:
  - skills/
  - scripts/
  - pack/
  - SCHEMA.md
  - OPERATOR.md
  - ROUTER.md
  - FRAMEWORK.md
  - inbox/_TEMPLATE.md
  - inbox/README.md
  - episodic/_TEMPLATE.md
  - _meta/CONTEXT_PROTOCOL.md

# Written by export if missing (never overwrite a filled HOST.yaml)
templates:
  - HOST.yaml
  - host/router-seeds.md
  - INDEX.md
  - log.md
  - temporal/TIMELINE.md
  - episodic/INDEX.md

# Never copy (project corpus)
exclude:
  - core/
  - theory/
  - applications/
  - market/
  - roadmap/
  - raw/
  - host/
  - INDEX.md
  - HOST.yaml
  - log.md
  - _meta/GRAPH.yaml
  - _meta/doctor-
  - _meta/heal-
  - _meta/usage/
