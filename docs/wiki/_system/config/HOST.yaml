# Host-owned overlay inside the portable RepoBrain engine layout.

name: Trell
anchor: >
  Epistemic programming language: certain T vs belief<T>; reduction only via
  verify/require + guard; speculative when/fork with rollback; Natural Trell
  colon + indent + end.
brief: AGENTS.md
claude_brief: CLAUDE.md
code_roots:
  - src/
  - examples/
  - tests/
raw:
  - THESIS.md
  - examples/
domains:
  - core
  - theory
  - applications
  - market
  - roadmap
  - meta
  - episodic
  - temporal
semantic_dirs:
  - core
  - theory
  - applications
  - market
  - roadmap
types_extra: []
router_seeds: docs/wiki/_system/config/router-seeds.md
maintain_skill: docs/wiki/_system/skills/repobrain-maintain/SKILL.md
graphify:
  enabled: true
  requirement: graphifyy>=0.9.54,<0.10
  code_only: true
  out: graphify-out
  roots:
    - src
  excludes:
    - '**/target/**'
    - '**/node_modules/**'
    - '**/vendor/**'
    - '**/dist/**'
    - '**/build/**'
    - '**/generated/**'
  emit_html: false
