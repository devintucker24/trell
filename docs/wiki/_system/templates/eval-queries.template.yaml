# Host eval contract. Copy to config/eval-queries.yaml and point
# expect_sources at reviewed corpus pages in this repository.
version: 2
updated: 2026-09-12
budgets:
  top_k: 8
  minimum_score_class: strong
  tier0_tokens: 2000
  retrieved_tokens: 3500
  total_context_tokens: 9500
