# Host overlay — fill after installing the RepoBrain engine.
name: My Project
anchor: >
  One paragraph: what this repo is, and the invariants agents must not dilute.
brief: AGENTS.md
claude_brief: CLAUDE.md
code_roots:
  - src/
raw: []
domains:
  - meta
  - episodic
  - temporal
semantic_dirs: []
types_extra: []
router_seeds: docs/wiki/_system/config/router-seeds.md

graphify:
  enabled: true
  requirement: graphifyy>=0.9.54,<0.10
  code_only: true
  out: graphify-out
  roots:
    - src
  excludes:
    - '**/target/**'
    - '**/node_modules/**'
    - '**/vendor/**'
    - '**/dist/**'
    - '**/build/**'
    - '**/generated/**'
  emit_html: false
