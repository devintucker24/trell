# Host overlay — fill after installing the RepoBrain engine.
name: My Project
anchor: >
  One paragraph: what this repo is, and the invariants agents must not dilute.
brief: AGENTS.md
claude_brief: CLAUDE.md
code_roots:
  - src/
raw: []
domains:
  - meta
  - episodic
  - temporal
semantic_dirs: []
types_extra: []
router_seeds: docs/wiki/_system/config/router-seeds.md

graphify:
  enabled: true
  requirement: graphifyy>=0.9.54,<0.10
  code_only: true
  out: graphify-out
  roots:
    - src
  excludes:
    - '**/target/**'
    - '**/node_modules/**'
    - '**/vendor/**'
    - '**/dist/**'
    - '**/build/**'
    - '**/generated/**'
  emit_html: false

# Git-tracked, non-authoritative project knowledge. RepoBrain commits the
# deterministic manifest and group pointers, but ignores converted text.
sources:
  enabled: true
  scan_on_setup: true
  roots:
    - .
  includes: []
  excludes:
    - docs/wiki/**
    - '**/target/**'
    - '**/node_modules/**'
    - '**/vendor/**'
    - '**/dist/**'
    - '**/build/**'
    - '**/generated/**'
    - graphify-out/**
  deny_globs:
    - '**/.env'
    - '**/.env.*'
    - '**/*credentials*'
    - '**/*secret*'
    - '**/*id_rsa*'
    - '**/*.pem'
  max_index_bytes: 262144
  max_excerpt_chars: 1200
  conversion:
    enabled: true
    requirement: markitdown==0.1.7
    formats:
      - csv
      - html
      - epub
      - pdf
      - docx
      - pptx
      - xlsx
    extras:
      pdf: markitdown[pdf]
      docx: markitdown[docx]
      pptx: markitdown[pptx]
      xlsx: markitdown[xlsx]
    commit_groups: []
    allow_external: false
    allow_plugins: false
    allow_urls: false
    allow_ocr: false
    allow_media: false
    allow_cloud: false
    strict: false
